# Vendored from the published accesskit_winit 0.33.2 crate
# (https://crates.io/crates/accesskit_winit), with the winit dependency
# repointed at the workspace winit so the adapter shares window and event
# types with `iced_winit`'s shell. AccessKit core and the platform adapter
# crates resolve from crates.io unchanged. Re-vendor on accesskit releases.
[package]
name = "accesskit_winit"
version = "0.33.2"
edition = "2024"
rust-version = "1.85"
authors = ["The AccessKit contributors"]
description = "AccessKit UI accessibility infrastructure: winit adapter (vendored for the iced fork)"
license = "Apache-2.0"
repository = "https://github.com/AccessKit/accesskit"
publish = false

[features]
async-io = ["accesskit_unix/async-io"]
default = ["accesskit_unix", "async-io", "rwh_06"]
rwh_05 = ["winit/rwh_05", "dep:rwh_05"]
rwh_06 = ["winit/rwh_06", "dep:rwh_06"]
tokio = ["accesskit_unix/tokio"]
x11 = ["winit/x11"]
wayland = ["winit/wayland"]

[dependencies]
accesskit = "0.24.1"
rwh_05 = { version = "0.5", features = ["std"], optional = true, package = "raw-window-handle" }
rwh_06 = { version = "0.6.2", features = ["std"], optional = true, package = "raw-window-handle" }
winit = { workspace = true }

[dev-dependencies]
winit = { workspace = true }

[target.'cfg(any(target_os = "linux", target_os = "dragonfly", target_os = "freebsd", target_os = "openbsd", target_os = "netbsd"))'.dependencies.accesskit_unix]
version = "0.22.1"
optional = true
default-features = false

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dev-dependencies.softbuffer]
version = "0.4.8"
default-features = false

[target.'cfg(target_os = "android")'.dependencies.accesskit_android]
version = "0.7.5"
features = ["embedded-dex"]
optional = true

[target.'cfg(target_os = "ios")'.dependencies.accesskit_ios]
version = "0.1.2"

[target.'cfg(target_os = "ios")'.dev-dependencies.softbuffer]
version = "0.4.8"
default-features = false

[target.'cfg(target_os = "macos")'.dependencies.accesskit_macos]
version = "0.26.3"

[target.'cfg(target_os = "windows")'.dependencies.accesskit_windows]
version = "0.34.0"
